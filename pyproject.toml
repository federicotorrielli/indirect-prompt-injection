[project]
name = "indirect-prompt-injection"
version = "0.1.0"
description = "Research on indirect prompt injection vulnerabilities in AI-generated peer reviews for scientific manuscripts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasets~=4.1.1",
    "matplotlib~=3.10.6",
    "nltk~=3.9.2",
    "numpy~=2.3.3",
    "pandas~=2.3.3",
    "plotly~=6.3.0",
    "pymupdf~=1.26.4",
    "scipy~=1.16.2",
    "seaborn~=0.13.2",
    "textblob~=0.19.0",
    "torch~=2.8.0",
    "transformers",
    "bitsandbytes",
    "vadersentiment~=3.3.2",
    "wordcloud~=1.9.4",
    "pypdf~=6.1.1",
    "reportlab~=4.4.4",
    "tqdm~=4.67.1",
    "accelerate~=1.10.1",
    "scikit-learn~=1.7.2",
    "undetected-chromedriver~=3.5.5",
    "gemini-webapi~=1.15.2",
    "browser-cookie3~=0.20.1",
    "rich~=14.1.0",
    "kernels~=0.10.2",
    "triton~=3.4.0",
    "triton-kernels",
    "python-dotenv>=1.1.1",
    "huggingface_hub>=0.35.3",
]
license = { text = "MIT" }

[tool.uv.sources]
triton-kernels = { git = "https://github.com/triton-lang/triton.git", subdirectory = "python/triton_kernels", rev = "main" }
transformers = { git = "https://github.com/huggingface/transformers.git", rev = "main" }
