[project]
name = "indirect-prompt-injection"
version = "0.1.0"
description = "Research on indirect prompt injection vulnerabilities in AI-generated peer reviews for scientific manuscripts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasets~=4.8.4",
    "matplotlib~=3.10.8",
    "nltk~=3.9.4",
    "numpy~=2.4.4",
    "pandas~=3.0.2",
    "plotly~=6.7.0",
    "pymupdf~=1.27.2.2",
    "scipy~=1.17.1",
    "seaborn~=0.13.2",
    "textblob~=0.20.0",
    "transformers",
    "bitsandbytes",
    "vadersentiment~=3.3.2",
    "wordcloud~=1.9.6",
    "pypdf~=6.10.0",
    "reportlab~=4.4.10",
    "tqdm~=4.67.3",
    "accelerate~=1.13.0",
    "scikit-learn~=1.8.0",
    "undetected-chromedriver",
    "gemini-webapi~=2.0.0",
    "browser-cookie3~=0.20.1",
    "rich~=14.3.4",
    "kernels~=0.13.0",
    "triton~=3.6.0",
    "triton-kernels",
    "python-dotenv>=1.2.2",
    "huggingface_hub",
    "tenacity~=9.1.4",
]

[tool.uv.sources]
triton-kernels = { git = "https://github.com/triton-lang/triton.git", subdirectory = "python/triton_kernels", rev = "main" }