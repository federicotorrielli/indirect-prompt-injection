[project]
name = "indirect-prompt-injection"
version = "0.1.0"
description = "Research on indirect prompt injection vulnerabilities in AI-generated peer reviews for scientific manuscripts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasets~=4.5.0",
    "matplotlib~=3.10.8",
    "nltk~=3.9.2",
    "numpy~=2.4.2",
    "pandas~=3.0.0",
    "plotly~=6.5.2",
    "pymupdf~=1.26.7",
    "scipy~=1.17.0",
    "seaborn~=0.13.2",
    "textblob~=0.19.0",
    "transformers",
    "bitsandbytes",
    "vadersentiment~=3.3.2",
    "wordcloud~=1.9.6",
    "pypdf~=6.6.2",
    "reportlab~=4.4.9",
    "tqdm~=4.67.3",
    "accelerate~=1.12.0",
    "scikit-learn~=1.8.0",
    "undetected",
    "gemini-webapi~=1.18.0",
    "browser-cookie3~=0.20.1",
    "rich~=14.3.2",
    "kernels~=0.12.1",
    "triton~=3.6.0",
    "triton-kernels",
    "python-dotenv>=1.2.1",
    "huggingface_hub",
]
license = { text = "MIT" }

[tool.uv.sources]
triton-kernels = { git = "https://github.com/triton-lang/triton.git", subdirectory = "python/triton_kernels", rev = "main" }
transformers = { git = "https://github.com/huggingface/transformers.git", rev = "main" }
